server {
    http2 on;
    index index.php index.html;
    server_name localhost;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access_log;
    root /var/www/html/Laravel-Login/public;

    client_max_body_size 10M;
    fastcgi_read_timeout 5000;

location /api/ {
    proxy_pass http://laravel_php:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    proxy_buffering off; # Evita retrasos en respuesta
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
}
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;


    location / {
        try_files $uri /index.php?$query_string;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    location ~ \.php$ {
        try_files   $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}